name: Tests

on: push

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run UI tests
        run: xvfb-run python -m pytest --ignore=tests/api

      # WITHOUT THIS STEP, NOTHING SURVIVES THE JOB.
      - name: Upload report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ github.run_number }}
          path: |
            report.html
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------ API (no browser)
  # NEW — no `needs:` line, so this runs IN PARALLEL with ui-tests.
  # No playwright install, no xvfb: this job finishes in about a minute.
  api-tests:
    runs-on: ubuntu-latest
    env:
      # The ROOT conftest.py demands these at import — even for API-only
      # runs. Same secrets, same names.
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/api -v

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ github.run_number }}
          path: report.html
          if-no-files-found: ignore
          retention-days: 14
